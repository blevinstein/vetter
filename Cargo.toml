[workspace]
resolver = "2"
members = ["vetter-core", "vet", "vetterd"]

[workspace.package]
version = "0.2.4"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/blevinstein/vetter"

[workspace.dependencies]
# Version is required alongside path so cargo-deny does not treat
# this as a wildcard when the consuming crates remain publishable
# (crates.io rejects path-only deps).
vetter-core = { path = "vetter-core", version = "0.2.4" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
anstyle = "1"

ulid = "1"

assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml", "json"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
