[package]
name = "vetter-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared core for vetter: parser plugin contract, parsed-command model, renderer, matcher, risk signals, and wire types."

[features]
default = []
# Enables the noop parser used in integration tests. The release binaries
# (`vet`, `vetterd`) intentionally do not turn this feature on.
test-parsers = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
anstyle = { workspace = true }
sha2 = "0.10"
serde_yaml_ng = "0.10"

[dev-dependencies]
insta = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = "1"

[[test]]
name = "registry"
path = "tests/registry.rs"
required-features = ["test-parsers"]

[[test]]
name = "registry_duplicate"
path = "tests/registry_duplicate.rs"
required-features = ["test-parsers"]

[[test]]
name = "pipeline"
path = "tests/pipeline.rs"
required-features = ["test-parsers"]

[[test]]
name = "noop_snapshot"
path = "tests/noop_snapshot.rs"
required-features = ["test-parsers"]

[[test]]
name = "curl_corpus"
path = "tests/curl_corpus.rs"

[[test]]
name = "curl_render_snapshot"
path = "tests/curl_render_snapshot.rs"

[[test]]
name = "matcher_props"
path = "tests/matcher_props.rs"

[[test]]
name = "allowlist_loader"
path = "tests/allowlist_loader.rs"
