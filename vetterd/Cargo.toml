[package]
name = "vetterd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "vetterd — long-running per-user daemon backing the vet CLI."

[lib]
name = "vetterd"
path = "src/lib.rs"

[[bin]]
name = "vetterd"
path = "src/main.rs"

[dependencies]
vetter-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
signal-hook = "0.3"

# macOS approver UI (Phase 4). Pulled in only on macOS targets so the
# crate still builds on Linux/CI workers; the daemon refuses to start
# its UI on non-macOS per Overview.md §7 ("macOS only for MVP").
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
# Phase-5 picker sheets render the YAML preview of each suggested
# rule in their accessory view; pulled in only on macOS because the
# headless test path has no use for it.
serde_yaml_ng = "0.10"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
