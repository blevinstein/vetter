[package]
name = "vetterd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "vetterd — long-running per-user daemon backing the vet CLI."

[lib]
name = "vetterd"
path = "src/lib.rs"

[[bin]]
name = "vetterd"
path = "src/main.rs"

[dependencies]
vetter-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Rule YAML preview in the allowlist picker (crate::cards::rules).
# Shared rather than macOS-gated since Phase 6d: the GTK picker
# shows the same pattern preview before persisting a rule.
serde_yaml_ng = "0.10"
signal-hook = "0.3"
# Already linked in via `vetter-core`'s public `HttpRequest::url`;
# declared here so the platform-neutral card layer can name `Url` in
# its own signatures. Adds nothing to the dependency graph.
url = { workspace = true }

# macOS approver UI (Phase 4). Pulled in only on macOS targets so the
# crate still builds on Linux/CI workers; the daemon refuses to start
# its UI on non-macOS per Overview.md §7 ("macOS only for MVP").
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

# Linux approver UI (Phase 6b). Gated to Linux targets the same way
# the `objc2` stack above is gated to macOS, so the crate still builds
# on every other target. `zbus`'s default features bring its own
# internal executor, which is what lets us drive the session bus from
# one dedicated thread via the blocking API — no general-purpose async
# runtime enters the dependency tree. See plans/LinuxApp.md §6b, §11.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"
# Tray icon (Phase 6c). `default-features = false` drops ksni's default
# `tokio` feature. ksni requires exactly one executor backend, so we
# pick `async-io` — the same one zbus already uses by default here —
# and add `blocking` for the synchronous handle API. The result keeps a
# general-purpose async runtime out of the tree entirely (verified:
# `cargo tree -i tokio` matches nothing) and resolves ksni onto the
# *same* zbus 5.19 we depend on directly, so there is one D-Bus crate
# in the build even though ksni opens its own connection. Chosen over
# hand-rolling because `com.canonical.dbusmenu` — layout revisions,
# GetGroupProperties, AboutToShow — is the single most error-prone
# surface in this phase. See plans/LinuxApp.md §6c.
ksni = { version = "0.3.6", default-features = false, features = [
    "async-io",
    "blocking",
] }
# Atomic write of the XDG autostart entry (Phase 6e). Already a
# dev-dependency here and a real one in vetter-core, so this pulls in
# nothing new — it just makes `fs_secure::persist_at_mode` reachable
# from the daemon's own writer.
tempfile = { workspace = true }
# Approval window (Phase 6d). GTK4 rather than an anchored popover:
# Wayland has no protocol for positioning a surface against a tray
# icon drawn by the host, so the window is one the compositor places
# (plans/LinuxApp.md §5.1). The C build dependencies are declared once
# in `tools/install-deps.sh` and deliberately not restated here.
#
# `glib` is not a direct dependency: gtk4 re-exports the exact version
# it was built against as `gtk4::glib`, and naming it separately is
# how you end up with two incompatible glib crates in one process.
gtk4 = "0.11"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
