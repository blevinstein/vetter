[package]
name = "vet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "vet — local security gate that wraps dangerous CLI commands for LLM coding agents."

[[bin]]
name = "vet"
path = "src/main.rs"

[dependencies]
vetter-core = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = "0.10"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# Build vetterd as a sibling test artefact so wrap-mode integration
# tests can spawn it via `assert_cmd::cargo_bin!("vetterd")`.
vetterd = { path = "../vetterd" }
