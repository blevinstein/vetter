name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # GTK4 approval window (Linux only) links system libraries; the
      # package list lives in one place — tools/install-deps.sh. Drop
      # the runner image's preinstalled Google Chrome repo first: we
      # never need it, and its mirror periodically serves a stale
      # Packages.gz that fails the hash check and aborts `apt-get
      # update` for the whole job.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: sudo apt-get update && tools/install-deps.sh --run
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GTK4 approval window links system libraries on Linux; no-op on
      # macOS (the script exits early there). See tools/install-deps.sh.
      # Drop the preinstalled Google Chrome repo first — see the
      # clippy job above for why.
      - if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - if: runner.os == 'Linux'
        run: sudo apt-get update && tools/install-deps.sh --run
      - run: cargo build --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.95
      # GTK4 approval window (Linux only) links system libraries; the
      # package list lives in one place — tools/install-deps.sh. Drop
      # the preinstalled Google Chrome repo first — see the clippy
      # job above for why.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: sudo apt-get update && tools/install-deps.sh --run
      - run: cargo build --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    # rustsec/audit-check posts results via the Checks API; without
    # checks:write the job fails with "Resource not accessible by
    # integration" even when the advisory scan itself succeeds.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
